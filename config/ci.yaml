# Overlay for the offline CI run (and local smoke tests): synthetic films and a
# deterministic stub embedder, so no torch, no dataset download and no GPU.
# Usage: CXR_CONFIG_OVERLAY=config/ci.yaml python features/build_feature_table.py
data:
  raw_dir: data/synthetic/chest_xray
  incoming_dir: data/synthetic/incoming

features:
  store_dir: feature_store/ci_features
  backbone: stub:pooled-pixels
  backbone_revision: v1

training:
  C: 0.5                  # the stub's 256 pixel features need little regularisation

evaluation:
  p1_probability: 0.85

gate:                     # CI proves the gate mechanics; the stub on synthetic films says nothing about quality
  min_sensitivity: 0.90   # small synthetic VAL: stub TEST sensitivity ~0.93

serving:
  champion_dir: outputs/ci/champion
  archive_dir: outputs/ci/archive
  candidate_dir: outputs/ci/candidate

models:                   # the other models on the same synthetic films (make_synthetic_cxr.py)
  pneumothorax:
    overrides:
      data:
        manifest: data/synthetic/nih_cxr14_subset.csv
        raw_dir: data/synthetic/nih_cxr14
      features:
        store_dir: feature_store/ci_nih_features
      training:
        C: 0.5
      gate:
        min_sensitivity: 0.80
  film_qc:
    overrides:
      features:
        store_dir: feature_store/ci_qc_features
      training:
        C: 0.5
      gate:               # the stub's 16x16 pixels miss a mild blur; CI proves mechanics only
        min_auroc: 0.80
        min_sensitivity: 0.70
        min_specificity: 0.70
        max_brier: 0.20
